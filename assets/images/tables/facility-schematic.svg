<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Schemat techniczny zaplecza produkcyjnego ALYNX Engineering: dwie suwnice 5t, stoły montażowe oraz śrutownia i malarnia hydrodynamiczna">
  <defs>
    <!-- Siatka rysunku technicznego CAD -->
    <pattern id="cadGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <pattern id="tableHoles" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.1" fill="#1E293B" stroke="#475569" stroke-width="0.9"/>
    </pattern>
  </defs>

  <!-- Tło techniczne -->
  <rect width="640" height="400" fill="#0F172A"/>
  <rect width="640" height="400" fill="url(#cadGrid)"/>

  <!-- Zewnętrzna ramka rysunku inżynierskiego -->
  <rect x="14" y="14" width="612" height="372" rx="4" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Pasek nagłówkowy schematu -->
  <circle cx="34" cy="38" r="4" fill="#22C55E"/>
  <text x="48" y="42" fill="#E2E8F0" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">ZAPLECZE PRODUKCYJNE // ALYNX</text>
  <text x="606" y="42" text-anchor="end" fill="#94A3B8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">STALOWA WOLA</text>
  <line x1="14" y1="58" x2="626" y2="58" stroke="#334155" stroke-width="1"/>

  <!-- PANEL 1: SUWNICE 2x5 TON (x=32, w=180) -->
  <g transform="translate(32, 78)">
    <rect width="180" height="224" rx="6" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <!-- Schemat suwnicy -->
    <g transform="translate(22, 26)">
      <!-- Belka nośna -->
      <rect x="0" y="12" width="136" height="12" rx="2" fill="none" stroke="#E2E8F0" stroke-width="1.6"/>
      <line x1="0" y1="6" x2="136" y2="6" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
      <!-- Wózek i liny -->
      <rect x="52" y="4" width="32" height="24" rx="2" fill="#0F172A" stroke="#22C55E" stroke-width="1.6"/>
      <line x1="62" y1="28" x2="62" y2="58" stroke="#94A3B8" stroke-width="1.5"/>
      <line x1="74" y1="28" x2="74" y2="58" stroke="#94A3B8" stroke-width="1.5"/>
      <!-- Zblocze i hak -->
      <rect x="57" y="56" width="22" height="10" rx="2" fill="#15803D" stroke="#22C55E" stroke-width="1.2"/>
      <path d="M 68 66 L 68 72 C 68 78, 76 78, 76 73 C 76 70, 73 69, 71 70" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <!-- Belka konstrukcyjna (ładunek) -->
      <line x1="68" y1="77" x2="40" y2="90" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 2"/>
      <line x1="68" y1="77" x2="96" y2="90" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 2"/>
      <rect x="26" y="90" width="84" height="14" rx="1.5" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
    </g>
    <!-- Opis -->
    <text x="90" y="168" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="700">Dwie suwnice</text>
    <text x="90" y="190" text-anchor="middle" fill="#22C55E" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700">udźwig 2 × 5 ton</text>
    <text x="90" y="209" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11">Elementy gabarytowe</text>
  </g>

  <!-- PANEL 2: STOŁY SPAWALNICZE (x=230, w=180) -->
  <g transform="translate(230, 78)">
    <rect width="180" height="224" rx="6" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <!-- Schemat stołu perforowanego 3D -->
    <g transform="translate(22, 26)">
      <!-- Płyta stołu z siatką otworów -->
      <rect x="12" y="16" width="112" height="72" rx="3" fill="#0F172A" stroke="#E2E8F0" stroke-width="1.6"/>
      <rect x="18" y="22" width="100" height="60" fill="url(#tableHoles)"/>
      <!-- Kątownik bazujący 90° -->
      <path d="M 32 70 L 32 34 L 74 34" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M 32 54 L 46 54 L 46 70" fill="none" stroke="#22C55E" stroke-width="1.2"/>
      <text x="53" y="49" fill="#22C55E" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" font-weight="700">90°</text>
      <!-- Linie wymiarowe CAD -->
      <line x1="12" y1="98" x2="124" y2="98" stroke="#64748B" stroke-width="1"/>
      <line x1="12" y1="93" x2="12" y2="103" stroke="#64748B" stroke-width="1"/>
      <line x1="124" y1="93" x2="124" y2="103" stroke="#64748B" stroke-width="1"/>
    </g>
    <!-- Opis -->
    <text x="90" y="168" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="15" font-weight="700">Stoły spawalnicze</text>
    <text x="90" y="190" text-anchor="middle" fill="#22C55E" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700">System modułowy</text>
    <text x="90" y="209" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11">Powtarzalna geometria</text>
  </g>

  <!-- PANEL 3: ŚRUTOWNIA I MALARNIA (x=428, w=180) -->
  <g transform="translate(428, 78)">
    <rect width="180" height="224" rx="6" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <!-- Schemat natrysku hydrodynamicznego i powłok -->
    <g transform="translate(22, 26)">
      <!-- Dysza natryskowa -->
      <path d="M 16 42 L 38 42 L 44 48 L 38 54 L 16 54 Z" fill="#0F172A" stroke="#E2E8F0" stroke-width="1.6"/>
      <line x1="22" y1="54" x2="20" y2="70" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <!-- Stożek strumienia hydrodynamicznego -->
      <line x1="45" y1="48" x2="88" y2="24" stroke="#22C55E" stroke-width="1.3" stroke-dasharray="4 3"/>
      <line x1="45" y1="48" x2="88" y2="48" stroke="#22C55E" stroke-width="1.6"/>
      <line x1="45" y1="48" x2="88" y2="72" stroke="#22C55E" stroke-width="1.3" stroke-dasharray="4 3"/>
      <!-- Warstwy zabezpieczenia stali -->
      <rect x="90" y="20" width="10" height="62" rx="1" fill="#15803D" stroke="#22C55E" stroke-width="1.2"/>
      <rect x="102" y="20" width="20" height="62" rx="1" fill="#334155" stroke="#E2E8F0" stroke-width="1.4"/>
      <!-- Strzałki kontroli -->
      <path d="M 88 94 L 122 94" stroke="#64748B" stroke-width="1"/>
      <circle cx="95" cy="94" r="2" fill="#22C55E"/>
    </g>
    <!-- Opis -->
    <text x="90" y="168" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14.5" font-weight="700">Śrutownia i Malarnia</text>
    <text x="90" y="190" text-anchor="middle" fill="#22C55E" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="700">Natrysk bezpowietrzny</text>
    <text x="90" y="209" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11">Ochrona antykorozyjna</text>
  </g>

  <!-- Dolna tabelka rysunkowa CAD -->
  <line x1="14" y1="328" x2="626" y2="328" stroke="#334155" stroke-width="1"/>
  <line x1="340" y1="328" x2="340" y2="386" stroke="#334155" stroke-width="1"/>
  <line x1="515" y1="328" x2="515" y2="386" stroke="#334155" stroke-width="1"/>

  <text x="32" y="352" fill="#94A3B8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.8">ZAKRES INFRASTRUKTURY</text>
  <text x="32" y="370" fill="#FFFFFF" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700">Hala produkcyjna + zaplecze inżynierskie</text>

  <text x="358" y="352" fill="#94A3B8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.8">KOOPERACJA</text>
  <text x="358" y="370" fill="#22C55E" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700">CNC &amp; Cięcie blach</text>

  <text x="533" y="352" fill="#94A3B8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.8">TYP</text>
  <text x="533" y="370" fill="#FFFFFF" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700">Schemat</text>
</svg>
